<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shizuku Lab — Order Preview</title><style>
:root{--bg:#f5f1e7;--paper:#fffdf8;--ink:#3f473c;--muted:#73796d;--line:#d9d8cc;--accent:#68745e;--dark:#353b32}*{box-sizing:border-box}body{margin:0;background:#ddd;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:105px}.hero{text-align:center;padding:30px 24px 22px}.logo{width:112px;height:112px;object-fit:contain;margin:auto}.handle{font-size:13px;color:var(--muted);margin:8px 0 14px}.intro{font:22px/1.35 Georgia,serif;margin:0 auto 15px;max-width:380px}.sub{font-size:13px;line-height:1.6;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0}.hours{margin:18px;background:var(--paper);border:1px solid #aeb2a6;border-radius:18px;padding:18px}.hours-top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em}.day{font:21px Georgia,serif;margin:15px 0 10px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px}.section{padding:0 20px;margin-top:28px}.section h2{font:400 23px Georgia,serif;letter-spacing:.1em}.product{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}.pic{width:92px;height:104px;object-fit:cover;border-radius:12px;background:#eee}.pinfo{flex:1}.pname{font:18px Georgia,serif;margin:4px 0}.desc{font-size:12px;color:var(--muted);line-height:1.5}.price{font-weight:600;margin-top:7px}.add{border:1px solid #aaa;background:transparent;border-radius:999px;width:34px;height:34px;align-self:center}.cartbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(470px,calc(100% - 24px));background:#fffdf8;border-radius:22px;padding:13px 16px;box-shadow:0 8px 30px #0003;display:flex;justify-content:space-between;z-index:20}.overlay{position:fixed;inset:0;background:#0005;display:none;z-index:30;align-items:flex-end}.sheet{background:var(--paper);width:min(520px,100%);margin:auto;border-radius:24px 24px 0 0;max-height:90vh;overflow:auto;padding:22px}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheet h3{font:25px Georgia,serif;margin:0}.x{border:0;border-radius:50%;width:34px;height:34px}.option{margin-top:18px}.option label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.choices{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.choice{border:1px solid #c7c9be;background:#fff;border-radius:18px;padding:8px 11px}.choice.active{background:var(--dark);color:#fff}.checkout{width:100%;border:0;background:var(--dark);color:#fff;border-radius:13px;padding:14px;margin-top:18px}.line{display:flex;justify-content:space-between;margin:9px 0}.footer{text-align:center;padding:60px 20px 25px;font-size:10px;letter-spacing:.1em;color:var(--muted)}
@media(min-width:800px){body{padding:25px}.app{box-shadow:0 10px 50px #0002;border-radius:24px;overflow:hidden}}
</style></head><body><div class="app"><header class="hero"><img id="logo" class="logo"><div id="handle" class="handle"></div><p id="intro" class="intro"></p><p id="collection" class="sub"></p></header><section class="hours"><div class="hours-top"><span id="scheduleLabel"></span><span>● OPEN</span></div><div id="scheduleDay" class="day"></div><div id="times" class="chips"></div></section><div id="menu"></div><div class="footer">POWERED BY SLOW STUDIO</div><div class="cartbar" id="cartbar"><b><span id="count">0</span> · view cart</b><span id="total">$0.00</span></div></div><div class="overlay" id="productOverlay"><div class="sheet" id="productSheet"></div></div><div class="overlay" id="cartOverlay"><div class="sheet"><div class="sheethead"><h3>Your cart</h3><button class="x" id="closeCart">×</button></div><div id="cartItems"></div><div class="line"><b>Total</b><b id="cartTotal">$0.00</b></div><button class="checkout">Checkout preview</button></div></div><script src="order-data.js"></script><script>
let data=JSON.parse(JSON.stringify(window.SHIZUKU_ORDER_DATA)),cart=[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){document.documentElement.style.setProperty('--bg',data.brand.background);document.documentElement.style.setProperty('--accent',data.brand.accent);$('#logo').src=data.brand.logo;$('#handle').textContent=data.brand.handle;$('#intro').textContent=data.brand.intro;$('#collection').textContent=data.brand.collection;$('#scheduleLabel').textContent=data.schedule.label;$('#scheduleDay').textContent=data.schedule.day;$('#times').innerHTML=data.schedule.times.map(x=>`<span class="chip">${esc(x)}</span>`).join('');const groups=[...new Set(data.products.map(p=>p.category))];$('#menu').innerHTML=groups.map(g=>`<section class="section"><h2>${esc(g)}</h2>${data.products.map((p,i)=>({...p,i})).filter(p=>p.category===g).map(p=>`<div class="product" data-product="${p.i}"><img class="pic" src="${esc(p.image)}"><div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="desc">${esc(p.description)}</div><div class="price">$${Number(p.price).toFixed(2)}</div></div><button class="add" data-add="${p.i}">+</button></div>`).join('')}</section>`).join('');bind();updateCart()}
function bind(){document.querySelectorAll('[data-product]').forEach(x=>x.onclick=()=>openProduct(+x.dataset.product));document.querySelectorAll('[data-add]').forEach(x=>x.onclick=e=>{e.stopPropagation();cart.push(+x.dataset.add);updateCart()})}function openProduct(i){const p=data.products[i],opt=data.options;$('#productSheet').innerHTML=`<div class="sheethead"><h3>${esc(p.name)}</h3><button class="x" id="closeProduct">×</button></div><img src="${esc(p.image)}" style="width:100%;height:220px;object-fit:cover;border-radius:16px;margin-top:14px"><p class="desc" style="font-size:14px">${esc(p.description)}</p><div class="option"><label>Ice</label><div class="choices">${opt.ice.map((x,j)=>`<button class="choice ${j===0?'active':''}">${esc(x)}</button>`).join('')}</div></div><div class="option"><label>Sweetness</label><div class="choices">${opt.sweetness.map((x,j)=>`<button class="choice ${j===2?'active':''}">${esc(x)}</button>`).join('')}</div></div>${p.milk?`<div class="option"><label>Milk</label><div class="choices">${opt.milk.map((x,j)=>`<button class="choice ${j===0?'active':''}">${esc(x)}</button>`).join('')}</div></div>`:''}<button class="checkout" id="addProduct">Add to cart · $${Number(p.price).toFixed(2)}</button>`;$('#productOverlay').style.display='flex';$('#closeProduct').onclick=()=>$('#productOverlay').style.display='none';$('#addProduct').onclick=()=>{cart.push(i);$('#productOverlay').style.display='none';updateCart()};document.querySelectorAll('.choices .choice').forEach(b=>b.onclick=()=>{[...b.parentElement.children].forEach(x=>x.classList.remove('active'));b.classList.add('active')})}
function updateCart(){const total=cart.reduce((s,i)=>s+Number(data.products[i]?.price||0),0);$('#count').textContent=cart.length;$('#total').textContent='$'+total.toFixed(2);$('#cartTotal').textContent='$'+total.toFixed(2)}$('#cartbar').onclick=()=>{$('#cartItems').innerHTML=cart.length?cart.map(i=>`<div class="line"><span>${esc(data.products[i].name)}</span><span>$${Number(data.products[i].price).toFixed(2)}</span></div>`).join(''):'<p class="desc">Your cart is empty.</p>';$('#cartOverlay').style.display='flex'};$('#closeCart').onclick=()=>$('#cartOverlay').style.display='none';window.addEventListener('message',e=>{if(e.data?.type==='ORDER_PREVIEW'){data=JSON.parse(JSON.stringify(e.data.data));render()}if(e.data?.type==='ORDER_NAVIGATE'){document.querySelector(e.data.target)?.scrollIntoView({behavior:'smooth'})}});render();
</script></body></html>
