<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Slow Studio · Secure account setup</title>
  <link rel="icon" type="image/png" href="/lumi-slow-studio.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#edf2eb;color:#263125;font-family:Arial,sans-serif}.card{width:min(460px,100%);padding:30px;border:1px solid #d6dfd3;border-radius:24px;background:#fff;box-shadow:0 18px 55px rgba(35,54,39,.12)}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px}.brand img{width:48px;height:48px;border-radius:14px;object-fit:cover}.eyebrow{margin-top:26px;color:#73826e;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-family:Georgia,serif;font-size:36px;line-height:1.05;margin:9px 0 10px}p{color:#687165;line-height:1.55}.field{display:grid;gap:6px;margin:14px 0}.field span{font-size:13px;font-weight:700}.field input{width:100%;padding:12px;border:1px solid #ccd6c9;border-radius:11px;font:inherit}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:#263f32;color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#edf2eb;color:#263f32}.qr{display:block;width:210px;height:210px;object-fit:contain;margin:15px auto;border:1px solid #d6dfd3;border-radius:14px;padding:8px}.notice{padding:12px 14px;border-radius:12px;background:#f4f7f2;color:#4e5b50;font-size:13px;line-height:1.45;margin:14px 0}.error{background:#fff0ed;color:#8b342c}.hidden{display:none}
  </style>
</head>
